          package com.example.taekwondo
          
          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import com.google.android.gms.nearby.Nearby
          import com.google.android.gms.nearby.connection.*
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          
          /**
           * Conexión P2P entre teléfonos de la misma sala (código de 4 dígitos).
           * Mejoras: reintento de discovery, aceptación más tolerante, lista de IDs visible.
           */
          class NearbySync(context: Context, private val myId: String) {
              private val client = Nearby.getConnectionsClient(context)
              private val connected = mutableSetOf<String>()
              private val names = mutableMapOf<String, String>()
              private val hostIds = mutableSetOf<String>()
              private var code = ""
              private var isHost = false
              private val handler = Handler(Looper.getMainLooper())
              private var restartDiscovery: Runnable? = null
          
              private val _peers = MutableStateFlow(0)
              val peers: StateFlow<Int> = _peers
              private val _peerIds = MutableStateFlow<List<String>>(emptyList())
              val peerIds: StateFlow<List<String>> = _peerIds
              private val _host = MutableStateFlow(false)
              val hostConnected: StateFlow<Boolean> = _host
              var onReceive: (String) -> Unit = {}
          
              private val service = "com.example.taekwondo.marcador"
              private val strategy = Strategy.P2P_CLUSTER
              private val myName get() = "$code:$myId:${if (isHost) "J" else "P"}"
          
              private fun refresh() {
                  _peers.value = connected.size
                  val ids = connected.mapNotNull { endpointId ->
                      names[endpointId]?.split(":")?.getOrNull(1)
                  }.sorted()
                  _peerIds.value = ids
                  _host.value = isHost || hostIds.isNotEmpty()
              }
          
              private val payloadCb = object : PayloadCallback() {
                  override fun onPayloadReceived(id: String, p: Payload) {
                      p.asBytes()?.let { onReceive(String(it)) }
                  }
                  override fun onPayloadTransferUpdate(id: String, u: PayloadTransferUpdate) {}
              }
          
              private val connCb = object : ConnectionLifecycleCallback() {
                  override fun onConnectionInitiated(id: String, info: ConnectionInfo) {
                      // Aceptar si es de la misma sala
                      if (info.endpointName.startsWith("$code:")) {
                          names[id] = info.endpointName
                          client.acceptConnection(id, payloadCb)
                      } else {
                          client.rejectConnection(id)
                      }
                  }
                  override fun onConnectionResult(id: String, r: ConnectionResolution) {
                      if (r.status.isSuccess) {
                          connected.add(id)
                          if (names[id]?.endsWith(":J") == true) hostIds.add(id)
                      } else {
                          // Si falla, quitar para poder reintentar
                          connected.remove(id)
                          names.remove(id)
                      }
                      refresh()
                  }
                  override fun onDisconnected(id: String) {
                      connected.remove(id)
                      hostIds.remove(id)
                      names.remove(id)
                      refresh()
                      // Reintentar discovery tras desconexión
                      scheduleDiscoveryRestart()
                  }
              }
          
              private val discCb = object : EndpointDiscoveryCallback() {
                  override fun onEndpointFound(id: String, info: DiscoveredEndpointInfo) {
                      val p = info.endpointName.split(":")
                      if (p.size == 3 && p[0] == code && id !in connected) {
                          // El de ID menor inicia la conexión (evita cruces)
                          // Si somos jefe, también podemos pedir a todos
                          val theirId = p[1]
                          if (myId < theirId || isHost) {
                              runCatching {
                                  client.requestConnection(myName, id, connCb)
                              }
                          }
                      }
                  }
                  override fun onEndpointLost(id: String) {}
              }
          
              private fun scheduleDiscoveryRestart() {
                  restartDiscovery?.let { handler.removeCallbacks(it) }
                  val r = Runnable {
                      if (code.isEmpty()) return@Runnable
                      runCatching {
                          client.stopDiscovery()
                          client.startDiscovery(
                              service, discCb,
                              DiscoveryOptions.Builder().setStrategy(strategy).build()
                          )
                      }
                  }
                  restartDiscovery = r
                  handler.postDelayed(r, 2500)
              }
          
              fun start(roomCode: String, host: Boolean) {
                  stop()
                  code = roomCode
                  isHost = host
                  refresh()
                  runCatching {
                      client.startAdvertising(
                          myName, service, connCb,
                          AdvertisingOptions.Builder().setStrategy(strategy).build()
                      )
                  }
                  runCatching {
                      client.startDiscovery(
                          service, discCb,
                          DiscoveryOptions.Builder().setStrategy(strategy).build()
                      )
                  }
                  // Reintento periódico de discovery (Nearby a veces se queda quieto)
                  scheduleDiscoveryRestart()
                  handler.postDelayed({ scheduleDiscoveryRestart() }, 8000)
              }
          
              fun stop() {
                  restartDiscovery?.let { handler.removeCallbacks(it) }
                  restartDiscovery = null
                  runCatching {
                      client.stopAdvertising()
                      client.stopDiscovery()
                      client.stopAllEndpoints()
                  }
                  connected.clear()
                  hostIds.clear()
                  names.clear()
                  isHost = false
                  code = ""
                  refresh()
              }
          
              fun broadcast(msg: String) {
                  if (connected.isEmpty()) return
                  runCatching {
                      client.sendPayload(connected.toList(), Payload.fromBytes(msg.toByteArray()))
                  }
              }
          }
