          package com.example.taekwondo

          import android.Manifest
          import android.content.pm.ActivityInfo
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.os.Build
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.WindowManager
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.activity.viewModels
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.lifecycle.lifecycleScope
          import kotlinx.coroutines.launch

          class MainActivity : ComponentActivity() {
              private val vm: MatchViewModel by viewModels()
              private var sync: NearbySync? = null
              private var pending: Pair<String, Boolean>? = null

              private val permLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { res -> if (res.values.all { it }) pending?.let { connect(it.first, it.second) } }

              private fun neededPermissions(): Array<String> = when {
                  Build.VERSION.SDK_INT >= 33 -> arrayOf(
                      Manifest.permission.BLUETOOTH_ADVERTISE, Manifest.permission.BLUETOOTH_CONNECT,
                      Manifest.permission.BLUETOOTH_SCAN, Manifest.permission.NEARBY_WIFI_DEVICES)
                  Build.VERSION.SDK_INT >= 31 -> arrayOf(
                      Manifest.permission.BLUETOOTH_ADVERTISE, Manifest.permission.BLUETOOTH_CONNECT,
                      Manifest.permission.BLUETOOTH_SCAN, Manifest.permission.ACCESS_FINE_LOCATION)
                  else -> arrayOf(Manifest.permission.ACCESS_FINE_LOCATION)
              }

              /** Pide permisos y entra a la sala (host = true crea la sala como jefe). */
              private fun requestConnect(code: String, host: Boolean) {
                  pending = code to host
                  permLauncher.launch(neededPermissions())
              }

              private fun connect(code: String, host: Boolean) {
                  val s = sync ?: NearbySync(this, vm.myId).also { sync = it }
                  vm.attachLink(s, code, host)
                  s.start(code, host)
              }

              private fun leave() {
                  sync?.stop()
                  vm.detachLink()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE

                  val tone = ToneGenerator(AudioManager.STREAM_ALARM, 100)
                  @Suppress("DEPRECATION")
                  val vibrator = getSystemService(VIBRATOR_SERVICE) as Vibrator
                  lifecycleScope.launch {
                      vm.buzz.collect {
                          tone.startTone(ToneGenerator.TONE_CDMA_ALERT_CALL_GUARD, 1500)
                          vibrator.vibrate(VibrationEffect.createOneShot(800, VibrationEffect.DEFAULT_AMPLITUDE))
                      }
                  }

                  val store = ConfigStore(this)
                  vm.restore(store.load())
                  vm.onConfigChanged = { store.save(it) }

                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme()) {
                          App(vm, onCreateRoom = { requestConnect(it, true) },
                              onJoinRoom = { requestConnect(it, false) }, onLeave = { leave() })
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  sync?.stop()
              }
          }
