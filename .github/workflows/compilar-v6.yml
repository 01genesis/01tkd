          @Composable
          private fun SidePanel(
              modifier: Modifier, name: String, color: Color, score: Int, fouls: Int, won: Int, maxFouls: Int,
              onPoints: (Int) -> Unit, onFoul: () -> Unit, enabled: Boolean
          ) {
              Column(
                  modifier.fillMaxHeight().background(color).padding(horizontal = 7.dp, vertical = 8.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Text(name, color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold, maxLines = 1)
                  Box(Modifier.weight(1f), contentAlignment = Alignment.Center) {
                      Text(
                          "$score", color = Color.White, fontSize = 104.sp, fontWeight = FontWeight.Black,
                          style = TextStyle(shadow = Shadow(Color.Black.copy(0.35f), blurRadius = 10f))
                      )
                  }
                  // Botones +1..+5
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(3.dp)) {
                      for (p in 1..5) {
                          SmallBtn("+$p", Modifier.weight(1f), enabled) { onPoints(p) }
                      }
                  }
                  Spacer(Modifier.height(5.dp))
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(3.dp)) {
                      SmallBtn("−1", Modifier.weight(1f), enabled) { onPoints(-1) }
                      SmallBtn("FALTA", Modifier.weight(2f), enabled) { onFoul() }
                  }
                  Spacer(Modifier.height(8.dp))
                  // Stats con barra de faltas visual
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          Text("GAM-JEOM", color = Color.White.copy(0.9f), fontSize = 10.sp, fontWeight = FontWeight.Bold)
                          Text("$fouls", color = Color.White, fontSize = 22.sp, fontWeight = FontWeight.Bold)
                          // Mini barra de progreso de faltas
                          Row(horizontalArrangement = Arrangement.spacedBy(2.dp)) {
                              repeat(maxFouls.coerceAtMost(8)) { i ->
                                  Box(
                                      Modifier.size(width = 8.dp, height = 4.dp)
                                          .background(
                                              if (i < fouls) Color.White else Color.Black.copy(0.35f),
                                              RoundedCornerShape(1.dp)
                                          )
                                  )
                              }
                          }
                      }
                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          Text("ROUNDS", color = Color.White.copy(0.9f), fontSize = 10.sp, fontWeight = FontWeight.Bold)
                          Text("$won", color = StatGreen, fontSize = 22.sp, fontWeight = FontWeight.Bold)
                      }
                  }
              }
          }
          
          @Composable
          private fun CenterPanel(
              totalRounds: Int, s: MatchState, vm: MatchViewModel,
              redColor: Color, blueColor: Color, signals: List<SignalEvent>
          ) {
              Column(
                  Modifier.width(170.dp).fillMaxHeight().background(Color(0xFF06060A)).padding(6.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.SpaceBetween
              ) {
                  RoundsStrip(totalRounds, s, redColor, blueColor)
          
                  Box(
                      Modifier
                          .border(2.5.dp, Yellow, RoundedCornerShape(10.dp))
                          .background(Color(0xFF0E0E14), RoundedCornerShape(10.dp))
                          .padding(horizontal = 14.dp, vertical = 7.dp)
                  ) {
                      Text(clock(s.secondsLeft), color = Color.White, fontSize = 34.sp, fontWeight = FontWeight.Bold)
                  }
          
                  Button(
                      onClick = { vm.toggleTimer() },
                      Modifier.fillMaxWidth().height(44.dp),
                      enabled = s.winner == null,
                      shape = RoundedCornerShape(11.dp),
                      colors = ButtonDefaults.buttonColors(
                          containerColor = if (s.running) Color(0xFFE65100) else Color(0xFF2E7D32)
                      )
                  ) {
                      Text(if (s.running) "PAUSAR" else "INICIAR", fontWeight = FontWeight.Bold, fontSize = 14.sp)
                  }
          
                  OutlinedButton(
                      onClick = { vm.undoLast() },
                      Modifier.fillMaxWidth().height(36.dp),
                      shape = RoundedCornerShape(10.dp),
                      contentPadding = PaddingValues(0.dp)
                  ) { Text("Deshacer", fontSize = 12.sp) }
          
                  SignalsPanel(signals)
              }
          }
          
          @Composable
          private fun SignalsPanel(signals: List<SignalEvent>) {
              Column(
                  Modifier.fillMaxWidth().heightIn(min = 52.dp, max = 96.dp)
                      .background(CardBg, RoundedCornerShape(9.dp)).padding(6.dp)
              ) {
                  Text("SEÑALES", color = Yellow, fontSize = 9.sp, fontWeight = FontWeight.Bold)
                  if (signals.isEmpty()) {
                      Text("—", color = Color(0xFF3A3A48), fontSize = 11.sp)
                  } else {
                      signals.take(4).forEach { sig ->
                          val side = if (sig.red) "R" else "A"
                          val txt = if (sig.kind == "P") "${sig.from} +${sig.points}$side" else "${sig.from} F$side"
                          Text(
                              txt + if (sig.confirmed) " ✓" else " …",
                              color = if (sig.confirmed) ConfirmGreen else PendingOrange,
                              fontSize = 11.sp, fontWeight = FontWeight.Bold, maxLines = 1
                          )
                      }
                  }
              }
          }
          
          @Composable
