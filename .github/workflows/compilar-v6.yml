          @Composable
          fun SettingsScreen(initial: MatchConfig, canShare: Boolean, onSave: (MatchConfig) -> Unit, onBack: () -> Unit) {
              var c by remember { mutableStateOf(initial) }
              Column(
                  Modifier.fillMaxSize().background(DarkBg).verticalScroll(rememberScrollState()).padding(20.dp)
              ) {
                  Text("Ajustes", color = Color.White, fontSize = 24.sp, fontWeight = FontWeight.Bold)
                  Spacer(Modifier.height(14.dp))
          
                  OutlinedTextField(c.redName, { c = c.copy(redName = it) }, label = { Text("Nombre rojo") },
                      singleLine = true, modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(12.dp), colors = fieldColors())
                  ColorRow(c.redColor) { c = c.copy(redColor = it) }
                  OutlinedTextField(c.blueName, { c = c.copy(blueName = it) }, label = { Text("Nombre azul") },
                      singleLine = true, modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(12.dp), colors = fieldColors())
                  ColorRow(c.blueColor) { c = c.copy(blueColor = it) }
          
