          package com.example.taekwondo
          
          import android.content.Context
          
          /** Guarda y carga los ajustes en el teléfono. */
          class ConfigStore(context: Context) {
              private val p = context.getSharedPreferences("ajustes", Context.MODE_PRIVATE)
          
              fun load(): MatchConfig {
                  val d = MatchConfig()
                  return MatchConfig(
                      redName = p.getString("rn", d.redName) ?: d.redName,
                      blueName = p.getString("bn", d.blueName) ?: d.blueName,
                      redColor = p.getLong("rc", d.redColor),
                      blueColor = p.getLong("bc", d.blueColor),
                      roundSeconds = p.getInt("rs", d.roundSeconds),
                      restSeconds = p.getInt("ts", d.restSeconds),
                      rounds = p.getInt("r", d.rounds),
                      maxFouls = p.getInt("f", d.maxFouls),
                      maxPointDiff = p.getInt("pd", d.maxPointDiff),
                      matchNumber = p.getInt("m", d.matchNumber)
                  )
              }
          
              fun save(c: MatchConfig) {
                  p.edit()
                      .putString("rn", c.redName).putString("bn", c.blueName)
                      .putLong("rc", c.redColor).putLong("bc", c.blueColor)
                      .putInt("rs", c.roundSeconds).putInt("ts", c.restSeconds)
                      .putInt("r", c.rounds).putInt("f", c.maxFouls)
                      .putInt("pd", c.maxPointDiff).putInt("m", c.matchNumber)
                      .apply()
              }
          }
