          @Composable
          private fun Stepper(label: String, value: Int, step: Int, min: Int, max: Int, onChange: (Int) -> Unit) {
              Row(Modifier.fillMaxWidth().padding(vertical = 5.dp), verticalAlignment = Alignment.CenterVertically) {
                  Text(label, color = Color.White, modifier = Modifier.weight(1f), fontSize = 13.sp)
                  Button(onClick = { onChange((value - step).coerceAtLeast(min)) },
                      contentPadding = PaddingValues(horizontal = 14.dp), shape = RoundedCornerShape(8.dp)) { Text("−") }
                  Text("$value", color = Color.White, fontSize = 18.sp, textAlign = TextAlign.Center,
                      modifier = Modifier.width(56.dp), fontWeight = FontWeight.Bold)
                  Button(onClick = { onChange((value + step).coerceAtMost(max)) },
                      contentPadding = PaddingValues(horizontal = 14.dp), shape = RoundedCornerShape(8.dp)) { Text("+") }
              }
          }
          
