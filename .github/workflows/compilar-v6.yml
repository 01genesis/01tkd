          @Composable
          private fun RoundsStrip(total: Int, s: MatchState, red: Color, blue: Color) {
              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                  Text("ROUNDS", color = Muted, fontSize = 9.sp, fontWeight = FontWeight.Bold)
                  Text("${s.redWon} – ${s.blueWon}", color = Yellow, fontSize = 22.sp, fontWeight = FontWeight.Bold)
                  Spacer(Modifier.height(3.dp))
                  for (i in 1..total) {
                      val done = s.roundScores.getOrNull(i - 1)
                      val bg = when {
                          done == null -> Color(0xFF16161F)
                          done.first > done.second -> red
                          done.second > done.first -> blue
                          else -> Color(0xFF455A64) // empate de puntos (se resolvió por sorteo)
                      }
                      val current = i == s.round && s.winner == null
                      Row(
                          Modifier.fillMaxWidth().padding(vertical = 1.5.dp)
                              .background(bg, RoundedCornerShape(5.dp))
                              .then(if (current) Modifier.border(1.5.dp, Yellow, RoundedCornerShape(5.dp)) else Modifier)
                              .padding(horizontal = 6.dp, vertical = 2.dp),
                          horizontalArrangement = Arrangement.SpaceBetween
                      ) {
                          Text("R$i", color = Color.White, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                          Text(
                              when {
                                  done != null -> "${done.first}-${done.second}"
                                  current -> "${s.red}-${s.blue}"
                                  else -> "–"
                              },
                              color = Color.White, fontSize = 11.sp
                          )
                      }
                  }
              }
          }
