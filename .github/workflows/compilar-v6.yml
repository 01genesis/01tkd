          FIN_7Q
          cat > app/src/main/java/com/example/taekwondo/Model.kt <<'FIN_7Q'
          package com.example.taekwondo
          
          import android.os.SystemClock
          import androidx.lifecycle.ViewModel
          import org.json.JSONObject
          import androidx.lifecycle.viewModelScope
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.flow.*
          import kotlinx.coroutines.launch
          
          data class MatchConfig(
              val redName: String = "ROJO",
              val blueName: String = "AZUL",
              val redColor: Long = 0xFFD32F2F,
              val blueColor: Long = 0xFF1E3FD8,
              val roundSeconds: Int = 120,
              val restSeconds: Int = 60,
              val rounds: Int = 3,
              val maxFouls: Int = 5,
              val maxPointDiff: Int = 15,   // diferencia máxima; 0 = desactivado
              val matchNumber: Int = 1
          )
          
          data class MatchState(
              val red: Int = 0,
              val blue: Int = 0,
              val redFouls: Int = 0,
              val blueFouls: Int = 0,
              val redWon: Int = 0,
              val blueWon: Int = 0,
              val round: Int = 1,
              val secondsLeft: Int = 120,
              val running: Boolean = false,
              val resting: Boolean = false,
              val roundScores: List<Pair<Int, Int>> = emptyList(),
              val winner: String? = null,
              val drawn: Boolean = false,
              val showWinnerScreen: Boolean = false,
              val roundDrawn: Boolean = false,
              /** Pantalla de sorteo del round: null = oculta, "RED"/"BLUE" = resultado del sorteo */
              val showRoundDraw: String? = null
          )
          
          data class SignalEvent(
              val id: String,
              val from: String,
              val kind: String,
              val red: Boolean,
              val points: Int,
              val at: Long,
              val confirmed: Boolean = false
          )
          
          class MatchViewModel : ViewModel() {
              private val _config = MutableStateFlow(MatchConfig())
              val config = _config.asStateFlow()
          
              private val _state = MutableStateFlow(MatchState())
              val state = _state.asStateFlow()
          
              private val _buzz = MutableSharedFlow<Unit>(extraBufferCapacity = 1)
              val buzz = _buzz.asSharedFlow()
          
              private val undo = ArrayDeque<MatchState>()
              private var timer: Job? = null
              private var winnerJob: Job? = null
              private var drawJob: Job? = null
          
              val myId = (1000..9999).random().toString()
              val peers = MutableStateFlow(0)
              val peerIds = MutableStateFlow<List<String>>(emptyList())
              private var link: NearbySync? = null
              private val votes = mutableListOf<Vote>()
              private val windowMs = 2200L
          
              val room = MutableStateFlow<Pair<String, Boolean>?>(null)
              val hostLink = MutableStateFlow(false)
              private var linkJob: Job? = null
          
              private val _signals = MutableStateFlow<List<SignalEvent>>(emptyList())
              val signals = _signals.asStateFlow()
          
              private val _lastConfirm = MutableSharedFlow<String>(extraBufferCapacity = 1)
              val lastConfirm = _lastConfirm.asSharedFlow()
          
              fun attachLink(l: NearbySync, code: String, isHost: Boolean) {
                  linkJob?.cancel()
                  link = l
                  room.value = code to isHost
                  l.onReceive = { msg -> runCatching { handle(msg) } }
                  linkJob = viewModelScope.launch {
                      launch { l.peers.collect { peers.value = it } }
                      launch { l.peerIds.collect { peerIds.value = it } }
                      launch { l.hostConnected.collect { hostLink.value = it } }
                  }
              }
          
              fun detachLink() {
                  linkJob?.cancel()
                  link = null
                  room.value = null
                  peers.value = 0
                  peerIds.value = emptyList()
                  hostLink.value = false
                  _signals.value = emptyList()
              }
          
              private fun send(o: JSONObject) { link?.broadcast(o.toString()) }
          
              private fun vote(kind: String, red: Boolean, v: Int) {
                  val now = SystemClock.elapsedRealtime()
                  send(JSONObject().put("t", "vote").put("from", myId).put("k", kind).put("red", red).put("v", v))
                  onVote(Vote(myId, kind, red, v, now))
              }
          
              private fun onVote(x: Vote) {
                  val now = SystemClock.elapsedRealtime()
                  votes.removeAll { now - it.at > windowMs }
                  votes.removeAll { it.from == x.from && it.kind == x.kind && it.red == x.red && it.v == x.v }
                  votes.add(x)
          
                  pushSignal(SignalEvent("${x.from}-${x.at}", x.from, x.kind, x.red,
                      if (x.kind == "P") x.v else 0, x.at, confirmed = false))
          
                  val need = if (peers.value == 0) 1 else 2
                  val same = votes.filter { it.kind == x.kind && it.red == x.red && it.v == x.v }
                  val uniqueFrom = same.map { it.from }.distinct()
          
                  if (uniqueFrom.size >= need) {
                      votes.removeAll { it.kind == x.kind && it.red == x.red && it.v == x.v }
                      _signals.update { list ->
                          list.map { s ->
                              if (s.kind == x.kind && s.red == x.red && s.points == x.v && !s.confirmed &&
                                  uniqueFrom.contains(s.from)) s.copy(confirmed = true) else s
                          }
                      }
                      if (x.kind == "P") doAdjust(x.red, x.v) else doFoul(x.red)
          
                      val side = if (x.red) "ROJO" else "AZUL"
                      val msg = if (x.kind == "P") "+${x.v} $side  ✓${uniqueFrom.size}" else "FALTA $side  ✓${uniqueFrom.size}"
                      viewModelScope.launch { _lastConfirm.emit(msg) }
                  }
              }
          
              private fun pushSignal(s: SignalEvent) {
                  _signals.update { (listOf(s) + it).take(12) }
                  viewModelScope.launch {
                      delay(4500)
                      _signals.update { list -> list.filter { it.id != s.id || it.confirmed } }
                      delay(2500)
                      _signals.update { list -> list.filter { it.id != s.id } }
                  }
              }
          
              private fun handle(msg: String) {
                  val o = JSONObject(msg)
                  when (o.getString("t")) {
                      "vote" -> onVote(Vote(o.getString("from"), o.getString("k"), o.getBoolean("red"),
                          o.getInt("v"), SystemClock.elapsedRealtime()))
                      "adj" -> doAdjust(o.getBoolean("red"), o.getInt("v"))
                      "undo" -> doUndo()
                      "run" -> setRunning(o.getBoolean("on"))
                      "cfg" -> applyConfig(configFromJson(o))
                      "win" -> {
                          val w = o.getString("w")
                          val drawn = o.optBoolean("d", false)
                          _state.update {
                              it.copy(winner = w, drawn = drawn, running = false, showWinnerScreen = true)
                          }
                          startWinnerTimer()
                      }
                      "rdraw" -> {
                          // Sorteo de round sincronizado desde otro teléfono
                          val side = o.getString("w") // "RED" o "BLUE"
                          applyRoundResult(redWins = side == "RED", roundDrawn = true, showDraw = true)
                      }
                  }
              }
          
              fun saveConfig(c: MatchConfig) {
                  applyConfig(c)
                  if (room.value?.second == true) send(configToJson(c).put("t", "cfg"))
              }
          
              fun applyConfig(c: MatchConfig) {
                  timer?.cancel()
                  winnerJob?.cancel()
                  drawJob?.cancel()
                  undo.clear()
                  _config.value = c
                  _state.value = MatchState(secondsLeft = c.roundSeconds)
                  _signals.value = emptyList()
                  onConfigChanged(c)
              }
          
              var onConfigChanged: (MatchConfig) -> Unit = {}
              private var restored = false
          
              fun restore(c: MatchConfig) {
                  if (restored) return
                  restored = true
                  applyConfig(c)
              }
          
              fun addPoints(isRed: Boolean, pts: Int) {
                  if (pts > 0) vote("P", isRed, pts)
                  else {
                      doAdjust(isRed, pts)
                      send(JSONObject().put("t", "adj").put("red", isRed).put("v", pts))
                  }
              }
          
              fun foul(isRed: Boolean) = vote("F", isRed, 0)
          
              private fun doAdjust(isRed: Boolean, pts: Int) {
                  edit {
                      if (isRed) copy(red = (red + pts).coerceAtLeast(0))
                      else copy(blue = (blue + pts).coerceAtLeast(0))
                  }
                  checkPointGap()
              }
          
              /** Si la diferencia de puntos alcanza el máximo configurado → gana el round. */
              private fun checkPointGap() {
                  val c = _config.value
                  if (c.maxPointDiff <= 0) return
                  val s = _state.value
                  if (s.winner != null || s.resting || s.showRoundDraw != null) return
                  val diff = s.red - s.blue
                  when {
                      diff >= c.maxPointDiff -> finishRoundByGap(redWins = true)
                      -diff >= c.maxPointDiff -> finishRoundByGap(redWins = false)
                  }
              }
          
              private fun finishRoundByGap(redWins: Boolean) {
                  timer?.cancel()
                  applyRoundResult(redWins = redWins, roundDrawn = false, showDraw = false)
              }
          
              private fun doFoul(isRed: Boolean) {
                  edit {
                      if (isRed) copy(red = (red - 1).coerceAtLeast(0), blue = blue + 1, redFouls = redFouls + 1)
                      else copy(blue = (blue - 1).coerceAtLeast(0), red = red + 1, blueFouls = blueFouls + 1)
                  }
                  val s = _state.value
                  val max = _config.value.maxFouls
                  if (s.winner != null) return
                  if (s.redFouls >= max) finishRoundByFoul(redLost = true)
                  else if (s.blueFouls >= max) finishRoundByFoul(redLost = false)
                  else checkPointGap()
              }
          
              private fun finishRoundByFoul(redLost: Boolean) {
                  timer?.cancel()
                  applyRoundResult(redWins = !redLost, roundDrawn = false, showDraw = false)
              }
          
              /**
               * Aplica el resultado de un round (por tiempo, faltas, diferencia o sorteo)
               * y decide si el combate termina o pasa a descanso.
               */
              private fun applyRoundResult(redWins: Boolean, roundDrawn: Boolean, showDraw: Boolean) {
                  val c = _config.value
                  val s = _state.value
                  undo.clear()
          
                  val scores = s.roundScores + (s.red to s.blue)
                  val rw = s.redWon + if (redWins) 1 else 0
                  val bw = s.blueWon + if (!redWins) 1 else 0
          
                  val roundsLeft = c.rounds - s.round
                  val matchOver = s.round >= c.rounds ||
                      rw > bw + roundsLeft || bw > rw + roundsLeft
          
                  if (showDraw) {
                      // Primero mostrar pantalla de sorteo; luego continuar
                      _state.value = s.copy(
                          redWon = rw, blueWon = bw, roundScores = scores,
                          running = false, resting = false,
                          roundDrawn = true, showRoundDraw = if (redWins) "RED" else "BLUE"
                      )
                      drawJob?.cancel()
                      drawJob = viewModelScope.launch {
                          delay(3200)
                          continueAfterRound(rw, bw, scores, matchOver, roundDrawn)
                      }
                  } else if (matchOver) {
                      var matchDrawn = false
                      val w = when {
                          rw > bw -> "RED"
                          bw > rw -> "BLUE"
                          else -> { matchDrawn = true; listOf("RED", "BLUE").random() }
                      }
                      _state.value = s.copy(
                          redWon = rw, blueWon = bw, roundScores = scores,
                          running = false, resting = false,
                          winner = w, drawn = matchDrawn, showWinnerScreen = true, roundDrawn = roundDrawn
                      )
                      send(JSONObject().put("t", "win").put("w", w).put("d", matchDrawn))
                      startWinnerTimer()
                  } else {
                      _state.value = s.copy(
                          redWon = rw, blueWon = bw, roundScores = scores,
                          resting = true, running = true,
                          secondsLeft = c.restSeconds, roundDrawn = roundDrawn, showRoundDraw = null
                      )
                      runTimer()
                  }
              }
          
              private fun continueAfterRound(
                  rw: Int, bw: Int, scores: List<Pair<Int, Int>>,
                  matchOver: Boolean, roundDrawn: Boolean
              ) {
                  val c = _config.value
                  val s = _state.value
                  if (matchOver) {
                      var matchDrawn = false
                      val w = when {
                          rw > bw -> "RED"
                          bw > rw -> "BLUE"
                          else -> { matchDrawn = true; listOf("RED", "BLUE").random() }
                      }
                      _state.value = s.copy(
                          showRoundDraw = null,
                          winner = w, drawn = matchDrawn, showWinnerScreen = true,
                          running = false, resting = false, roundDrawn = roundDrawn
                      )
                      send(JSONObject().put("t", "win").put("w", w).put("d", matchDrawn))
                      startWinnerTimer()
                  } else {
                      _state.value = s.copy(
                          showRoundDraw = null,
                          resting = true, running = true,
                          secondsLeft = c.restSeconds, roundDrawn = roundDrawn
                      )
                      runTimer()
                  }
              }
          
              fun undoLast() {
                  doUndo()
                  send(JSONObject().put("t", "undo"))
              }
          
              private fun doUndo() {
                  val p = undo.removeLastOrNull() ?: return
                  _state.update {
                      it.copy(
                          red = p.red, blue = p.blue, redFouls = p.redFouls, blueFouls = p.blueFouls,
                          winner = p.winner, drawn = p.drawn, showWinnerScreen = false,
                          roundDrawn = p.roundDrawn, showRoundDraw = null
                      )
                  }
              }
          
              fun toggleTimer() {
                  val on = !_state.value.running
                  setRunning(on)
                  send(JSONObject().put("t", "run").put("on", on))
              }
          
              private fun setRunning(on: Boolean) {
                  val s = _state.value
                  if (s.winner != null || s.running == on || s.showRoundDraw != null) return
                  if (!on) {
                      timer?.cancel()
                      _state.update { it.copy(running = false) }
                  } else {
                      _state.update { it.copy(running = true) }
                      runTimer()
                  }
              }
          
              private fun edit(block: MatchState.() -> MatchState) {
                  val s = _state.value
                  if (s.winner != null || s.showRoundDraw != null) return
                  undo.addLast(s)
                  if (undo.size > 50) undo.removeFirst()
                  _state.value = s.block()
              }
          
              private fun runTimer() {
                  timer?.cancel()
                  timer = viewModelScope.launch {
                      while (true) {
                          delay(1000)
                          val cur = _state.updateAndGet { it.copy(secondsLeft = it.secondsLeft - 1) }
                          if (cur.secondsLeft <= 0) {
                              _buzz.tryEmit(Unit)
                              if (cur.resting) startNextRound() else endRound()
                              break
                          }
                      }
                  }
              }
          
              /** Fin de round por tiempo. Empate de puntos → sorteo visible. */
              private fun endRound() {
                  val s = _state.value
                  when {
                      s.red > s.blue -> applyRoundResult(redWins = true, roundDrawn = false, showDraw = false)
                      s.blue > s.red -> applyRoundResult(redWins = false, roundDrawn = false, showDraw = false)
                      else -> {
                          // Empate → sorteo
                          val redWins = listOf(true, false).random()
                          val side = if (redWins) "RED" else "BLUE"
                          send(JSONObject().put("t", "rdraw").put("w", side))
                          applyRoundResult(redWins = redWins, roundDrawn = true, showDraw = true)
                      }
                  }
              }
          
              private fun startWinnerTimer() {
                  winnerJob?.cancel()
                  winnerJob = viewModelScope.launch {
                      delay(4000)
                      _state.update { it.copy(showWinnerScreen = false) }
                  }
              }
          
              fun dismissWinnerAndReset() {
                  winnerJob?.cancel()
                  drawJob?.cancel()
                  applyConfig(_config.value)
              }
          
              private fun startNextRound() {
                  val c = _config.value
                  _state.update {
                      it.copy(
                          round = it.round + 1,
                          red = 0, blue = 0,
                          redFouls = 0, blueFouls = 0,
                          resting = false, running = false,
                          secondsLeft = c.roundSeconds,
                          roundDrawn = false, showRoundDraw = null
                      )
                  }
              }
          }
          
          private data class Vote(val from: String, val kind: String, val red: Boolean, val v: Int, val at: Long)
          
          private fun configToJson(c: MatchConfig) = JSONObject()
              .put("rn", c.redName).put("bn", c.blueName).put("rc", c.redColor).put("bc", c.blueColor)
              .put("rs", c.roundSeconds).put("ts", c.restSeconds).put("r", c.rounds)
              .put("f", c.maxFouls).put("pd", c.maxPointDiff).put("m", c.matchNumber)
          
          private fun configFromJson(o: JSONObject) = MatchConfig(
              redName = o.getString("rn"), blueName = o.getString("bn"),
              redColor = o.getLong("rc"), blueColor = o.getLong("bc"),
              roundSeconds = o.getInt("rs"), restSeconds = o.getInt("ts"),
              rounds = o.getInt("r"), maxFouls = o.getInt("f"),
              maxPointDiff = o.optInt("pd", 15), matchNumber = o.getInt("m")
          )
          FIN_7Q
          cat > app/src/main/java/com/example/taekwondo/Screens.kt <<'FIN_7Q'
          package com.example.taekwondo
          
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.shadow
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.runtime.saveable.rememberSaveable
          import androidx.compose.ui.graphics.Shadow
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.res.painterResource
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontWeight
          import kotlinx.coroutines.delay
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          
          private val Yellow = Color(0xFFFFE600)
          private val StatGreen = Color(0xFF39FF14)
          private val PendingOrange = Color(0xFFFFB74D)
          private val ConfirmGreen = Color(0xFF69F0AE)
          private val DarkBg = Color(0xFF07070B)
          private val CardBg = Color(0xFF12121A)
          private val Muted = Color(0xFF78909C)
          
          @Composable
          fun App(vm: MatchViewModel, onCreateRoom: (String) -> Unit, onJoinRoom: (String) -> Unit, onLeave: () -> Unit) {
              var showSplash by rememberSaveable { mutableStateOf(true) }
              LaunchedEffect(Unit) { delay(2800); showSplash = false }
              if (showSplash) { SplashScreen { showSplash = false }; return }
              var page by remember { mutableStateOf("board") }
              val cfg by vm.config.collectAsState()
              val room by vm.room.collectAsState()
              when (page) {
                  "settings" -> SettingsScreen(cfg, canShare = room?.second == true,
                      onSave = { vm.saveConfig(it); page = "board" }, onBack = { page = "board" })
                  "connect" -> ConnectScreen(vm, onCreateRoom, onJoinRoom, onLeave) { page = "board" }
                  else -> ScoreboardScreen(vm, onSettings = { page = "settings" }, onConnect = { page = "connect" })
              }
          }
          
          @Composable
          fun ConnectScreen(
              vm: MatchViewModel, onCreate: (String) -> Unit, onJoin: (String) -> Unit,
              onLeave: () -> Unit, onBack: () -> Unit
          ) {
              val room by vm.room.collectAsState()
              val peers by vm.peers.collectAsState()
              val peerIds by vm.peerIds.collectAsState()
              val hostLink by vm.hostLink.collectAsState()
              var code by remember { mutableStateOf("") }
              val r = room
          
              Column(
                  Modifier.fillMaxSize().background(DarkBg).verticalScroll(rememberScrollState()).padding(20.dp),
                  verticalArrangement = Arrangement.spacedBy(14.dp)
              ) {
                  Text("Conexión", color = Color.White, fontSize = 26.sp, fontWeight = FontWeight.Bold)
                  Text("Tu ID: ${vm.myId}", color = Yellow, fontSize = 14.sp, fontWeight = FontWeight.SemiBold)
          
                  if (r != null) {
                      val (rc, host) = r
                      Card(
                          colors = CardDefaults.cardColors(containerColor = CardBg),
                          shape = RoundedCornerShape(18.dp),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Column(Modifier.padding(22.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                              Text(
                                  if (host) "Jefe de sala" else "Participante",
                                  color = Muted, fontSize = 13.sp
                              )
                              Text(rc, color = Yellow, fontSize = 68.sp, fontWeight = FontWeight.Black)
                              Spacer(Modifier.height(14.dp))
                              ConnectionDots(3, peers + 1)
                              Spacer(Modifier.height(8.dp))
                              Text(
                                  "${peers + 1} dispositivo${if (peers + 1 != 1) "s" else ""}" +
                                      when {
                                          host -> ""
                                          hostLink -> " · jefe OK"
                                          else -> " · buscando jefe…"
                                      },
                                  color = Color.White, fontSize = 14.sp
                              )
                              if (peerIds.isNotEmpty()) {
                                  Text("Otros: ${peerIds.joinToString(", ")}", color = Muted, fontSize = 12.sp)
                              }
                          }
                      }
                      Text(
                          "Con varios teléfonos hacen falta mínimo 2 señales iguales para sumar.",
                          color = Muted, fontSize = 13.sp
                      )
                      OutlinedButton(
                          onClick = onLeave,
                          modifier = Modifier.fillMaxWidth().height(48.dp),
                          shape = RoundedCornerShape(12.dp),
                          colors = ButtonDefaults.outlinedButtonColors(contentColor = Color(0xFFFF5252))
                      ) { Text("Salir de la sala") }
                  } else {
                      Button(
                          onClick = { onCreate((1000..9999).random().toString()) },
                          modifier = Modifier.fillMaxWidth().height(54.dp),
                          shape = RoundedCornerShape(14.dp),
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF5C6BC0))
                      ) { Text("Crear sala (soy el jefe)", fontSize = 16.sp, fontWeight = FontWeight.Bold) }
          
                      Text("— o entra con el código del jefe —", color = Muted, fontSize = 13.sp,
                          modifier = Modifier.fillMaxWidth(), textAlign = TextAlign.Center)
          
                      OutlinedTextField(
                          code, { code = it.filter { ch -> ch.isDigit() }.take(4) },
                          label = { Text("Código de 4 dígitos") },
                          singleLine = true,
                          keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(12.dp),
                          colors = OutlinedTextFieldDefaults.colors(
                              focusedBorderColor = Yellow, focusedLabelColor = Yellow, cursorColor = Yellow
                          )
                      )
                      Button(
                          onClick = { onJoin(code) },
                          enabled = code.length == 4,
                          modifier = Modifier.fillMaxWidth().height(54.dp),
                          shape = RoundedCornerShape(14.dp)
                      ) { Text("Unirme a la sala", fontSize = 16.sp, fontWeight = FontWeight.Bold) }
                  }
                  OutlinedButton(
                      onClick = onBack,
                      modifier = Modifier.fillMaxWidth().height(48.dp),
                      shape = RoundedCornerShape(12.dp)
                  ) { Text("Volver al marcador") }
              }
          }
          
          @Composable
          private fun ConnectionDots(totalExpected: Int, connectedCount: Int) {
              val ok = connectedCount >= 2
              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.Center, verticalAlignment = Alignment.CenterVertically) {
                  for (i in 0 until totalExpected) {
                      val filled = i < connectedCount
                      Box(
                          Modifier.padding(horizontal = 7.dp).size(18.dp).clip(CircleShape)
                              .background(
                                  when {
                                      filled && ok -> Yellow
                                      filled -> Color(0xFFFFC107)
                                      else -> Color(0xFF2A2A35)
                                  }
                              )
                              .border(1.dp, if (filled) Color.White.copy(0.45f) else Color(0xFF3A3A48), CircleShape)
                      )
                  }
                  Spacer(Modifier.width(12.dp))
                  Text(
                      when {
                          connectedCount >= 3 -> "3 conectados ✓"
                          connectedCount == 2 -> "2 conectados"
                          connectedCount == 1 -> "Solo este"
                          else -> "Sin conexión"
                      },
                      color = if (ok) Yellow else Muted,
                      fontWeight = FontWeight.Bold,
                      fontSize = 13.sp
                  )
              }
          }
          
          private fun clock(sec: Int) = "%d:%02d".format(sec / 60, sec % 60)
          
          @Composable
          fun ScoreboardScreen(vm: MatchViewModel, onSettings: () -> Unit, onConnect: () -> Unit) {
              val s by vm.state.collectAsState()
              val c by vm.config.collectAsState()
              val peers by vm.peers.collectAsState()
              val room by vm.room.collectAsState()
              val signals by vm.signals.collectAsState()
          
              var confirmMsg by remember { mutableStateOf<String?>(null) }
              LaunchedEffect(Unit) {
                  vm.lastConfirm.collect { msg ->
                      confirmMsg = msg
                      delay(1800)
                      confirmMsg = null
                  }
              }
          
              Box(Modifier.fillMaxSize().background(Color.Black)) {
                  Column(Modifier.fillMaxSize()) {
                      // Top bar
                      Row(
                          Modifier.fillMaxWidth().background(Color(0xFF0A0A10))
                              .padding(horizontal = 10.dp, vertical = 5.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Text(
                              if (s.resting) "DESCANSO" else "R${s.round}/${c.rounds}",
                              color = if (s.resting) Color(0xFF80CBC4) else Color.White,
                              fontWeight = FontWeight.Bold, fontSize = 14.sp
                          )
                          if (s.roundDrawn && s.resting) {
                              Spacer(Modifier.width(6.dp))
                              Text("· round por sorteo", color = Yellow, fontSize = 11.sp)
                          }
                          Spacer(Modifier.width(8.dp))
                          MiniConnectionDots(if (room != null) peers + 1 else 0)
                          Spacer(Modifier.width(6.dp))
                          Text(
                              room?.let { (rc, host) -> "$rc${if (host) " ★" else ""} · ${peers + 1}" } ?: "offline",
                              color = Muted, fontSize = 11.sp, modifier = Modifier.weight(1f)
                          )
                          TextButton(onClick = onConnect, contentPadding = PaddingValues(horizontal = 8.dp)) {
                              Text("Conexión", fontSize = 12.sp)
                          }
                          TextButton(onClick = onSettings, enabled = !s.running, contentPadding = PaddingValues(horizontal = 8.dp)) {
                              Text("Ajustes", fontSize = 12.sp)
                          }
                      }
          
                      Row(Modifier.weight(1f).fillMaxWidth()) {
                          SidePanel(Modifier.weight(1f), c.redName, Color(c.redColor), s.red, s.redFouls, s.redWon, c.maxFouls,
                              { vm.addPoints(true, it) }, { vm.foul(true) }, s.winner == null && !s.resting)
                          CenterPanel(c.rounds, s, vm, Color(c.redColor), Color(c.blueColor), signals)
                          SidePanel(Modifier.weight(1f), c.blueName, Color(c.blueColor), s.blue, s.blueFouls, s.blueWon, c.maxFouls,
                              { vm.addPoints(false, it) }, { vm.foul(false) }, s.winner == null && !s.resting)
                      }
                  }
          
                  confirmMsg?.let { msg ->
                      Box(
                          Modifier.align(Alignment.TopCenter).padding(top = 48.dp)
                              .shadow(10.dp, RoundedCornerShape(10.dp))
                              .clip(RoundedCornerShape(10.dp))
                              .background(ConfirmGreen)
                              .padding(horizontal = 20.dp, vertical = 9.dp)
                      ) {
                          Text(msg, color = Color.Black, fontWeight = FontWeight.Bold, fontSize = 16.sp)
                      }
                  }
          
                  // Sorteo visible del round
                  s.showRoundDraw?.let { side ->
                      RoundDrawOverlay(
                          name = if (side == "RED") c.redName else c.blueName,
                          color = Color(if (side == "RED") c.redColor else c.blueColor)
                      )
                  }
          
                  if (s.showWinnerScreen && s.winner != null) {
                      WinnerOverlay(
                          name = if (s.winner == "RED") c.redName else c.blueName,
                          color = Color(if (s.winner == "RED") c.redColor else c.blueColor),
                          drawn = s.drawn,
                          onDismiss = { vm.dismissWinnerAndReset() }
                      )
                  }
              }
          }
          
          
          @Composable
          private fun RoundDrawOverlay(name: String, color: Color) {
              val infinite = rememberInfiniteTransition(label = "draw")
              val pulse by infinite.animateFloat(
                  0.92f, 1.08f,
                  infiniteRepeatable(tween(500, easing = FastOutSlowInEasing), RepeatMode.Reverse),
                  label = "pulse"
              )
              Box(
                  Modifier.fillMaxSize().background(Color.Black.copy(alpha = 0.92f)),
                  contentAlignment = Alignment.Center
              ) {
                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                      Text(
                          "SORTEO",
                          color = Yellow,
                          fontSize = 22.sp,
                          fontWeight = FontWeight.Bold,
                          letterSpacing = 12.sp
                      )
                      Spacer(Modifier.height(8.dp))
                      Text(
                          "Empate en el round",
                          color = Color.White.copy(0.7f),
                          fontSize = 14.sp
                      )
                      Spacer(Modifier.height(20.dp))
                      Box(
                          Modifier
                              .size((120 * pulse).dp)
                              .clip(CircleShape)
                              .background(color)
                              .border(3.dp, Yellow, CircleShape),
                          contentAlignment = Alignment.Center
                      ) {
                          Text("★", color = Color.White, fontSize = 36.sp)
                      }
                      Spacer(Modifier.height(18.dp))
                      Text(
                          "GANA EL ROUND",
                          color = Color.White.copy(0.85f),
                          fontSize = 16.sp,
                          fontWeight = FontWeight.Bold,
                          letterSpacing = 4.sp
                      )
                      Spacer(Modifier.height(6.dp))
                      Text(
                          name,
                          color = color,
                          fontSize = 42.sp,
                          fontWeight = FontWeight.Black,
                          style = TextStyle(shadow = Shadow(Color.Black, blurRadius = 12f))
                      )
                  }
              }
          }
          
          @Composable
          private fun WinnerOverlay(name: String, color: Color, drawn: Boolean, onDismiss: () -> Unit) {
              Box(
                  Modifier.fillMaxSize().background(color).clickable { onDismiss() },
                  contentAlignment = Alignment.Center
              ) {
                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                      Text("GANADOR", color = Color.White.copy(0.9f), fontSize = 26.sp,
                          fontWeight = FontWeight.Bold, letterSpacing = 10.sp)
                      Spacer(Modifier.height(10.dp))
                      Text(
