                  Stepper("Número de rounds", c.rounds, 1, 1, 5) { c = c.copy(rounds = it) }
                  Stepper("Faltas máximas (pierde el round)", c.maxFouls, 1, 1, 20) { c = c.copy(maxFouls = it) }
                  Stepper("Diferencia máxima de puntos (0=off)", c.maxPointDiff, 1, 0, 30) { c = c.copy(maxPointDiff = it) }
                  if (c.maxPointDiff > 0) {
                      Text(
                          "Si un lado saca ${c.maxPointDiff} puntos de diferencia, gana el round.",
                          color = Color(0xFF78909C), fontSize = 12.sp
                      )
                  }
          
                  Spacer(Modifier.height(18.dp))
                  Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                      OutlinedButton(onClick = onBack, modifier = Modifier.weight(1f).height(48.dp), shape = RoundedCornerShape(12.dp)) {
                          Text("Cancelar")
                      }
                      Button(onClick = { onSave(c) }, modifier = Modifier.weight(1.3f).height(48.dp), shape = RoundedCornerShape(12.dp)) {
                          Text(if (canShare) "Guardar y enviar" else "Guardar")
                      }
                  }
              }
          }
          
